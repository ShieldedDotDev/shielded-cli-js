# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on: [ push, pull_request ]

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      SHIELDED_USER_TOKEN: ${{ secrets.SHIELDED_USER_TOKEN }}

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci
    - run: npm run build
    - name: Check compiled output is clean
      run: |
        if [ -n "$(git status --porcelain --untracked-files=all -- ./dist)" ]; then
          git status --short -- ./dist
          git diff -- ./dist
          echo "::error::./dist has uncommitted changes after build"
          exit 1
        fi
    - run: npm run lint
    # - run: npm test
    - run: npm install -g .
    - run: shielded --key shieldeddotdev-last-update-cli --text "$(date)"
